name: Sequential calibration v2

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/sequential-calibration-v2
    paths:
      - "benchmarks/sequential_calibration_protocol_v2.json"
      - "benchmarks/sequential_calibration_v2.py"
      - "benchmarks/v1_failed_calibration_record.json"
      - "tests/test_sequential_calibration_v2.py"
      - ".github/workflows/sequential-calibration-v2.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel "numpy>=1.24" "Cython>=3.0"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]" --no-build-isolation

      - name: Build Cython extensions
        run: python setup.py build_ext --inplace

      - name: Check v2 benchmark helpers
        run: python -m pytest tests/test_sequential_calibration_v2.py -q

      - name: Lint v2 benchmark implementation
        run: |
          ruff check benchmarks/sequential_calibration_v2.py tests/test_sequential_calibration_v2.py --select E,F,W,I,B
          black --check benchmarks/sequential_calibration_v2.py tests/test_sequential_calibration_v2.py

      - name: Run frozen v2 benchmark
        run: python benchmarks/sequential_calibration_v2.py

      - name: Upload v2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sequential-calibration-v2-evidence
          path: benchmarks/results_v2/
          if-no-files-found: error
