[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=1.24"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cfad"
version = "0.1.0"
description = "Characteristic Function Anomaly Detector: contour-integral residue scoring for structural breaks in financial time series"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
keywords = ["anomaly detection", "characteristic function", "contour integration", "Lévy processes", "financial time series", "change-point detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Cython",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "statsmodels>=0.14",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "black", "ruff", "mypy", "Cython>=3.0", "hypothesis>=6.100"]
notebooks = ["jupyter", "seaborn", "yfinance"]
docs = ["sphinx", "sphinx-rtd-theme", "numpydoc"]

[project.urls]
Homepage = "https://github.com/diogoribeiro7/cfad"
Repository = "https://github.com/diogoribeiro7/cfad"
Documentation = "https://cfad.readthedocs.io"
Changelog = "https://github.com/diogoribeiro7/cfad/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/diogoribeiro7/cfad/issues"

[project.scripts]
cfad = "cfad.cli:main"

[tool.cibuildwheel]
build-frontend = "build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
