name: Build wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "cfad/**"
      - ".github/workflows/build_wheels.yml"
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"
          CIBW_BEFORE_BUILD: >-
            python -m pip install "Cython>=3.0" "numpy>=1.24" "packaging>=24.2"
          CIBW_TEST_COMMAND: "python -c \"from cfad import detect; import numpy as np; r = detect(np.random.normal(0,.01,200), window=50); print('wheel OK:', len(r.scores), 'windows')\""

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
