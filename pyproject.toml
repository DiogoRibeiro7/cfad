[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=1.24", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cfad"
version = "0.2.2"
description = "Research software for ECF-based distributional change analysis in financial returns"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Diogo Ribeiro" }
]
keywords = [
  "anomaly detection",
  "empirical characteristic function",
  "financial time series",
  "change-point detection",
  "CUSUM",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Cython",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "statsmodels>=0.14",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "Cython>=3.0",
  "hypothesis>=6.100",
]
notebooks = ["jupyter", "seaborn", "yfinance"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/cfad"
Repository = "https://github.com/DiogoRibeiro7/cfad"
Documentation = "https://cfad.readthedocs.io"
Changelog = "https://github.com/DiogoRibeiro7/cfad/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/DiogoRibeiro7/cfad/issues"

[project.scripts]
cfad = "cfad.cli:main"

[tool.setuptools.packages.find]
include = ["cfad*"]

[tool.setuptools.package-data]
cfad = ["py.typed"]

[tool.cibuildwheel]
build-frontend = "build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
