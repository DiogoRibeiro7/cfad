name: Corrected benchmark evidence

on:
  push:
    branches: [experiment/benchmark-evidence]
    paths:
      - "benchmarks/corrected_protocol.json"
      - "benchmarks/corrected_benchmark.py"
      - ".github/workflows/corrected-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel "numpy>=1.24" "Cython>=3.0"
          python -m pip install -e . --no-build-isolation

      - name: Run frozen corrected benchmark
        run: python benchmarks/corrected_benchmark.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: corrected-benchmark-evidence
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 30
