name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel "numpy>=1.24" "Cython>=3.0" "packaging>=24.2"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]" --no-build-isolation

      - name: Build Cython extensions
        run: python setup.py build_ext --inplace

      - name: Run tests
        run: python -m pytest tests/ --cov=cfad --cov-report=xml --cov-fail-under=67

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel "numpy>=1.24" "Cython>=3.0" "packaging>=24.2"
          python -m pip install -e ".[dev]" --no-build-isolation

      - name: Reject compile-level Python errors repo-wide
        run: ruff check cfad tests apps --select E9,F63,F7

      - name: Lint compatibility changes
        run: |
          ruff check \
            cfad/backtest.py \
            cfad/bootstrap.py \
            cfad/contour.py \
            cfad/utils.py \
            apps/dashboard.py \
            tests/test_api_utils.py \
            tests/test_backtest.py \
            tests/test_models.py \
            tests/test_properties.py \
            tests/test_regression.py \
            --select E,F,W,I,B

      - name: Format compatibility changes
        run: |
          black --check \
            cfad/backtest.py \
            cfad/bootstrap.py \
            cfad/contour.py \
            cfad/utils.py \
            apps/dashboard.py \
            tests/test_api_utils.py \
            tests/test_backtest.py \
            tests/test_models.py \
            tests/test_properties.py \
            tests/test_regression.py
