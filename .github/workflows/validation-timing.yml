name: Validation timing correction

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "paper/validation_timing_protocol.md"
      - "benchmarks/validation_timing_benchmark.py"
      - "tests/test_validation_timing_benchmark.py"
      - ".github/workflows/validation-timing.yml"

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-build-isolation

      - name: Focused tests
        run: python -m pytest -q tests/test_validation_timing_benchmark.py

      - name: Lint timing files
        run: python -m ruff check benchmarks/validation_timing_benchmark.py tests/test_validation_timing_benchmark.py

      - name: Run timing correction
        if: github.event_name == 'workflow_dispatch'
        run: python benchmarks/validation_timing_benchmark.py

      - name: Upload timing evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: validation-timing-evidence
          path: benchmarks/results_validation_timing/
          if-no-files-found: error
          retention-days: 90
