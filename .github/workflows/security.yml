name: Security scan

on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 4 * * 1"   # Monday 04:00 UTC

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit
      - run: bandit -r cfad/ -ll --exclude cfad/_ext/

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install safety
      - run: safety check --file pyproject.toml
